<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
  <title id="title">SpaceRS-Agent Architecture</title>
  <desc id="desc">Final SPACERS-M3 system architecture with SpaceBudget-RS, HiRes-View, RemoteLoRA, OrbitQuant, OrbitGuard-RS and resource monitoring.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f2a44"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#10203a" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #122033; }
      .subtitle { font: 15px Arial, sans-serif; fill: #526174; }
      .box-title { font: 700 18px Arial, sans-serif; fill: #14213d; }
      .box-text { font: 14px Arial, sans-serif; fill: #334155; }
      .small { font: 13px Arial, sans-serif; fill: #475569; }
      .pill { font: 700 13px Arial, sans-serif; fill: #0f3d4a; }
      .line { stroke: #1f2a44; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="860" fill="#f7fafc"/>
  <text x="640" y="52" text-anchor="middle" class="title">SpaceRS-Agent: Resource-Aware Remote-Sensing MLLM System</text>
  <text x="640" y="78" text-anchor="middle" class="subtitle">Frozen delivery line: RemoteLoRA + OrbitQuant + HiRes-View + SpaceBudget-RS + OrbitGuard-RS</text>

  <g filter="url(#shadow)">
    <rect x="420" y="112" width="440" height="72" rx="14" fill="#ffffff" stroke="#b8c7d9"/>
    <text x="640" y="142" text-anchor="middle" class="box-title">Remote Sensing Input</text>
    <text x="640" y="166" text-anchor="middle" class="box-text">single image / paired change images / question metadata</text>
  </g>

  <path class="line" d="M640 184 L640 224"/>

  <g filter="url(#shadow)">
    <rect x="360" y="224" width="560" height="138" rx="16" fill="#e8f6f3" stroke="#2a9d8f"/>
    <text x="640" y="255" text-anchor="middle" class="box-title">SpaceBudget-RS</text>
    <text x="640" y="280" text-anchor="middle" class="box-text">task-aware dynamic visual compute budgeting</text>
    <rect x="400" y="306" width="108" height="34" rx="17" fill="#d7f0eb" stroke="#2a9d8f"/>
    <text x="454" y="328" text-anchor="middle" class="pill">ECO</text>
    <rect x="530" y="306" width="128" height="34" rx="17" fill="#d7e8f7" stroke="#2878b5"/>
    <text x="594" y="328" text-anchor="middle" class="pill">BALANCED</text>
    <rect x="680" y="306" width="132" height="34" rx="17" fill="#f8dde2" stroke="#d1495b"/>
    <text x="746" y="328" text-anchor="middle" class="pill">PRECISION</text>
    <rect x="828" y="306" width="72" height="34" rx="17" fill="#f6ead8" stroke="#c77700"/>
    <text x="864" y="328" text-anchor="middle" class="pill">AUTO</text>
  </g>

  <path class="line" d="M640 362 L640 406"/>

  <g filter="url(#shadow)">
    <rect x="360" y="406" width="560" height="78" rx="14" fill="#fff7ed" stroke="#d97706"/>
    <text x="640" y="436" text-anchor="middle" class="box-title">HiRes-View</text>
    <text x="640" y="461" text-anchor="middle" class="box-text">optional global + 2x2 high-resolution fallback, used only when justified</text>
  </g>

  <path class="line" d="M640 484 L640 528"/>

  <g filter="url(#shadow)">
    <rect x="360" y="528" width="560" height="86" rx="14" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="640" y="559" text-anchor="middle" class="box-title">RemoteLoRA</text>
    <text x="640" y="584" text-anchor="middle" class="box-text">Qwen3-VL-2B-Instruct + LoRA v1</text>
    <text x="640" y="604" text-anchor="middle" class="small">remote-sensing Caption / VQA / Grounding adaptation</text>
  </g>

  <path class="line" d="M640 614 L640 658"/>

  <g filter="url(#shadow)">
    <rect x="360" y="658" width="560" height="70" rx="14" fill="#f1f5f9" stroke="#475569"/>
    <text x="640" y="688" text-anchor="middle" class="box-title">OrbitQuant</text>
    <text x="640" y="712" text-anchor="middle" class="box-text">INT4 NF4 deployment candidate with BF16 fallback</text>
  </g>

  <path class="line" d="M640 728 L640 772"/>

  <g filter="url(#shadow)">
    <rect x="360" y="772" width="560" height="62" rx="14" fill="#fef2f2" stroke="#b91c1c"/>
    <text x="640" y="799" text-anchor="middle" class="box-title">OrbitGuard-RS</text>
    <text x="640" y="821" text-anchor="middle" class="box-text">integrity check, fault detection, recovery</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="38" y="268" width="260" height="214" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="168" y="300" text-anchor="middle" class="box-title">Resource Monitor</text>
    <text x="76" y="335" class="box-text">visual tokens</text>
    <text x="76" y="365" class="box-text">latency</text>
    <text x="76" y="395" class="box-text">P95</text>
    <text x="76" y="425" class="box-text">peak VRAM</text>
    <text x="76" y="455" class="box-text">failures</text>
  </g>
  <path class="thin" d="M298 375 C340 375 326 293 360 293"/>
  <path class="thin" d="M298 400 C340 400 326 693 360 693"/>

  <g filter="url(#shadow)">
    <rect x="980" y="528" width="250" height="192" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1105" y="560" text-anchor="middle" class="box-title">Outputs</text>
    <text x="1025" y="596" class="box-text">Caption</text>
    <text x="1025" y="626" class="box-text">VQA</text>
    <text x="1025" y="656" class="box-text">Grounding</text>
    <text x="1025" y="686" class="box-text">Change Captioning</text>
  </g>
  <path class="line" d="M920 803 C1010 803 1010 624 980 624"/>

  <g filter="url(#shadow)">
    <rect x="980" y="235" width="250" height="176" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1105" y="267" text-anchor="middle" class="box-title">Resource Modes</text>
    <text x="1020" y="304" class="box-text">Power-Limited -> ECO</text>
    <text x="1020" y="334" class="box-text">Normal -> AUTO</text>
    <text x="1020" y="364" class="box-text">Urgent -> PRECISION</text>
    <text x="1020" y="394" class="box-text">HiRes fallback on demand</text>
  </g>
  <path class="thin" d="M980 323 C940 323 960 293 920 293"/>

  <text x="640" y="852" text-anchor="middle" class="subtitle">Deterministic routing, no new training, no prompt search, no benchmark protocol changes</text>
</svg>
